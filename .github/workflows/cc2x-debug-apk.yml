name: CC2X Debug APK

on:
  push:
    branches:
      - feature/cc2x-rfid-brand-name-v1
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  assemble-debug:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout project
        uses: actions/checkout@v4
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - name: Install Android SDK platform 37
        run: |
          echo "Android SDK: $ANDROID_HOME"
          command -v sdkmanager
          sdkmanager --install "platforms;android-37" "build-tools;37.0.0"
      - name: Assemble debug APK
        run: ./gradlew --no-daemon --stacktrace :app:assembleDebug
      - name: Calculate APK checksum
        if: success()
        run: sha256sum app/build/outputs/apk/debug/*.apk
      - name: Upload installable debug APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: CC2X-Android-Debug-APK
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
