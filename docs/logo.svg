<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- Solid background — Play Store requires no transparency -->
  <rect width="512" height="512" fill="#1B1464"/>

  <!-- Filament spool -->
  <!-- Outer flange -->
  <circle cx="180" cy="256" r="100" fill="none" stroke="#FFFFFF" stroke-width="14"/>
  <!-- Filament body (gradient for depth) -->
  <circle cx="180" cy="256" r="68" fill="none" stroke="url(#filamentGrad)" stroke-width="14"/>
  <!-- Inner hub -->
  <circle cx="180" cy="256" r="28" fill="#FFFFFF"/>

  <!-- RFID signal waves -->
  <path d="M 310 220 A 96 96 0 0 1 310 292
           M 350 184 A 144 144 0 0 1 350 328
           M 390 148 A 192 192 0 0 1 390 364"
        fill="none" stroke="#FFFFFF" stroke-width="14" stroke-linecap="round"/>

  <defs>
    <linearGradient id="filamentGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#9775FA"/>
      <stop offset="100%" stop-color="#651FFF"/>
    </linearGradient>
  </defs>
</svg>
